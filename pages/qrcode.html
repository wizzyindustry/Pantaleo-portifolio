<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart QR Generator</title>
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-T45WWDJSTZ"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-T45WWDJSTZ');
    </script>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: arial, sans-serif;
        background: #2c4ca7;
    }

    .card {
        width: 360px;
        padding: 30px;
        margin-top: 2rem;
        text-align: center;
        background: #fff;
        border-radius: 20px;
        box-shadow: 0 20px 50px #0005;
    }

    h2 {
        margin-bottom: 8px;
    }

    p {
        color: #777;
        margin-bottom: 25px;
    }

    input {
        width: 100%;
        padding: 14px;
        border: 1px solid #ddd;
        border-radius: 10px;
        outline: none;
        font-size: 15px;
    }

    button {
        width: 100%;
        padding: 13px;
        margin-top: 12px;
        border: 0;
        border-radius: 10px;
        cursor: pointer;
        font-size: 15px;
        background: #111;
        font-weight: bold;
        color: #fff;
    }

    #qrcode {
        margin: 25px auto 10px;
        width: fit-content;
    }

    #download {
        display: none;
        background: #16a34a;
    }


    /* loading animation */
    .intro-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background-color: #2c4ca7;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: 0.8s ease;
    }

    .name {
        color: #fff;
        font-size: 60px;
        letter-spacing: 5px;
        opacity: 0;
        transform: translateY(40px);
        transition: 0.8s ease;
    }

    .btn {
        background: transparent;
        color: #2c4ca7;
        font-weight: 900;
        font-size: 15px;
        border: 2px solid #2c4ca7;
        animation-name: fadein;
        animation-duration: .3s;
        animation: forwards;
        transition: 0.2s ease;
    }

    @keyframes fadein {
        from {
            transform: translateY(20);
        }

        to {
            transform: translateY(200);
        }
    }

    .btn:hover {
        background: #2c4ca7;
        color: #fff;
    }
</style>

<body>

    <!-----LOADING INTOR-------->
    <div class="intro-loader">
        <h1 class="name">QR GENERATOR/..</h1>
    </div>


    <div class="card">
        <h2>Smart Qr Generator</h2>

        <p>Turn any link into a Qrcode</p>

        <input type="url" id="link" placeholder="https://example.com">

        <button onclick="generateQR()">Generate QR code</button>

        <div id="qrcode"></div>

        <button onclick="downloadQR()" id="download">Download QR code</button>

        <a href="/index.html" target="_parent"><button class="btn">Back</button></a>
    </div>




    <script>
        function generateQR() {
            const link = document.getElementById("link").value;
            const qr = document.getElementById("qrcode");
            const download = document.getElementById("download");

            if (!link) return alert("Please enter link first!!");

            qr.innerHTML = "";
            qr.className = "show";

            new QRCode(qr, link);

            download.style.display = "block";
        }

        function downloadQR() {
            const img = document.querySelector("#qrcode img");

            const link = document.createElement("a");

            link.href = img.src;
            link.download = "qrcode.png";
            link.click();
        }


        //LOADING PAGE ANIMATION
        window.addEventListener("load", () => {

            const name = document.querySelector(".name");
            const intro = document.querySelector(".intro-loader");

            setTimeout(() => {
                name.style.opacity = "1";
                name.style.transform = "translateY(0)";
            }, 300);

            setTimeout(() => {
                intro.style.top = "-150%";
            }, 2000);

        });
    </script>
</body>

</html>
