<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat na Emanuel Pantaleo</title>

    <meta property="og:title" content="Emanuel Portfolio - Graphic Designer">
    <meta property="og:description" content="Habari Emanuel, nimepitia portfolio yako naomba unifanyie kazi.">
    <meta property="og:image" content="https://pantaleo-protifolio.netlify.app/assets/icons/panta logo-01.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:type" content="website">
</head>

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Segoe UI', sans-serif;
        background: #f8f9ff;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        flex-direction: column;
    }

    .card {
        background: white;
        padding: 40px 30px;
        border-radius: 20px;
        box-shadow: 0 10px 40px rgba(44, 76, 167, 0.1);
        text-align: center;
        max-width: 360px;
        width: 90%;
    }

    .logo {
        width: 90px;
        height: 90px;
        background: white;
        border-radius: 18px;
        margin: 0 auto 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid #2c4ca7;
    }

    .logo img {
        width: 60px;
    }

    /* loading animation */
    .loader {
        width: 40px;
        height: 40px;
        border: 4px solid #e8ecff;
        border-top: 4px solid #2c4ca7;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: 20px auto;
    }

    @keyframes spin {
        0% {
            transform: rotate(0deg);
        }

        100% {
            transform: rotate(360deg);
        }
    }

    h2 {
        color: #1a1a1a;
        font-size: 18px;
        margin-bottom: 8px;
    }

    p {
        color: #666;
        font-size: 14px;
        line-height: 1.5;
    }

    .dots::after {
        content: "";
        animation: dot 1.5s infinite;
    }

    @keyframes dot {
        0% {
            content: '.';
        }

        33% {
            content: '..';
        }

        66% {
            content: '...';
        }
    }


    /* loading animation */
    .intro-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        background-color: #2c4ca7;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: 0.8s ease;
    }

    .name {
        color: #fff;
        font-size: 60px;
        letter-spacing: 5px;
        opacity: 0;
        transform: translateY(40px);
        transition: 0.8s ease;
    }
</style>

<body>

    <div class="intro-loader">
        <h1 class="name">WhatsApp Redirecting/..</h1>
    </div>

    <div class="card">
        <div class="logo">
            <img src="https://pantaleo-protifolio.netlify.app/assets/icons/panta logo-01.jpg" alt="EP logo"
                style="width: 80%; object-fit: contain;">
        </div>
    </div>
    <div class="loader"></div>
    <h2>Inakupeleka WhatsApp <span class="dots"></span></h2>
    <p>Tafadhali subiri kidogo, tunaandaa ujumbe wako kwa Emanuel</p>

    <script>
        //baada ya secunde 2.5, peleka whatsApp
        setTimeout(function () {
            window.location.href = "https://wa.link/cagorp"
        }, 2500);

        //LOADING PAGE ANIMATION
        window.addEventListener("load", () => {

            const name = document.querySelector(".name");
            const intro = document.querySelector(".intro-loader");

            setTimeout(() => {
                name.style.opacity = "1";
                name.style.transform = "translateY(0)";
            }, 300);

            setTimeout(() => {
                intro.style.top = "-150%";
            }, 2000);

        });
    </script>
    <!-- <p>Redirecting to WhatsApp...... Please wait.....</p> -->
</body>

</html>
